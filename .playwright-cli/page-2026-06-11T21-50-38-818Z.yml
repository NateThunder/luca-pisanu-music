        - blockquote [ref=e32]: “I’m a dot in the middle of nothing, but in my nothing I can achieve everything.”
        - generic [ref=e33]:
          - paragraph [ref=e34]: Luca Pisanu is a singer-songwriter, composer, producer and multi-instrumentalist based in Glasgow, UK.
          - paragraph [ref=e35]: Drawn to music from an early age, he began playing guitar at eight. That first instrument set him on a journey through a wide range of genres and turned a childhood passion into his life’s focus.
          - paragraph [ref=e36]: Influenced by artists including Stevie Wonder, Stevie Ray Vaughan and Jimi Hendrix, Luca creates eclectic, deeply expressive music rooted in blues, soul, jazz, funk and neo-soul.
          - paragraph [ref=e37]: After performing with several projects across the UK, Italy and France, Luca began exploring his solo career and developing the groovy, suave sound that has come to define his work.
          - paragraph [ref=e38]: His wider work has included playing bass for Tom McGuire and the Brassholes, guitar for Charlotte Marshall and the 45s, and working as an in-demand session musician in Glasgow.
          - paragraph [ref=e39]: Warm vocals, melodic guitars and engaging bass lines make Luca Pisanu an artist to watch.
